<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#07191a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MedSim 3D</title>
<style>
html,body{margin:0;height:100%;background:#07191a;color:#eef9f7;font-family:Inter,system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:520px}.loading b{font-size:22px}.loading small{display:block;margin-top:8px;color:#a8c8c1;line-height:1.5}.err{color:#ffd0d0;white-space:pre-wrap;text-align:left;background:#321b1e;padding:14px;border-radius:14px;margin-top:14px;font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
<div class="loading"><div class="box"><b>Cargando MedSim 3D…</b><small>Preparando simulador clínico</small><div id="error"></div></div></div>
<script>
(async()=>{
  const errorBox=document.getElementById('error');
  const base='https://raw.githubusercontent.com/sidfrir/calculadora-3d/medsim3d-deploy-20260916/medsim3d/';
  const clean=s=>String(s||'').replace(/[^A-Za-z0-9+/=]/g,'');
  const pad=s=>{s=clean(s);while(s.length%4)s+='=';return s};
  const b64bytes=s=>Uint8Array.from(atob(pad(s)),c=>c.charCodeAt(0));
  const joinBytes=(a,b)=>{const out=new Uint8Array(a.length+b.length);out.set(a,0);out.set(b,a.length);return out};
  const ungzip=bytes=>new TextDecoder().decode(pako.ungzip(bytes));
  function render(html){document.open();document.write(html);document.close()}
  try{
    const rs=await Promise.all(['payload1.txt','payload2.txt'].map(async f=>{
      const r=await fetch(base+f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+': HTTP '+r.status);
      return await r.text();
    }));
    const [a,b]=rs;
    let html='';
    const attempts=[];
    try{const combined=(clean(a).replace(/=/g,'')+clean(b).replace(/=/g,''));html=ungzip(b64bytes(combined))}catch(e){attempts.push('combined: '+e.message)}
    if(!html){try{html=ungzip(joinBytes(b64bytes(a),b64bytes(b)))}catch(e){attempts.push('separate-bytes: '+e.message)}}
    if(!html){try{html=ungzip(b64bytes(a))+ungzip(b64bytes(b))}catch(e){attempts.push('separate-gzip: '+e.message)}}
    if(!html || !/^\s*<!doctype html/i.test(html)) throw new Error('No se pudo reconstruir el HTML.\n'+attempts.join('\n'));
    render(html);
  }catch(e){errorBox.className='err';errorBox.textContent='No se pudo cargar MedSim 3D.\n'+(e&&e.stack?e.stack:String(e))}
})();
</script>
</body>
</html>
