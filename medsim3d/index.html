<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07191a"><title>MedSim 3D</title><style>html,body{margin:0;height:100%;background:#07191a;color:#eef9f7;font-family:system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;padding:24px;text-align:center}.loading b{font-size:20px}</style><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div class="loading"><div><b>Cargando MedSim 3D...</b><br><small>Preparando simulador clínico</small></div></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/sidfrir/calculadora-3d/medsim3d-deploy-20260916/medsim3d/';const [a,b]=await Promise.all(['payload1.txt','payload2.txt'].map(f=>fetch(base+f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})));const bin=atob((a+b).trim());const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder().decode(pako.ungzip(bytes));document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>No se pudo cargar MedSim 3D.</b><br><small>'+String(e)+'</small></div></div>'}})();</script></body></html>
